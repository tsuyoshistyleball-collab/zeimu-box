<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>税務ボックス</title>
  <meta name="description" content="銀行・クレカ明細をGoogleドライブに整理して集計するアプリ" />
  <meta name="theme-color" content="#1f6f5c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="税務ボックス" />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <script src="version.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>税務ボックス <small id="headerVersion" class="ver"></small></h1>
    <div class="top-actions">
      <a id="driveLink" class="btn small" target="_blank" rel="noopener" title="Googleドライブを開く">📁</a>
      <button id="authBtn" class="btn small">ログイン</button>
    </div>
  </header>

  <main>
    <!-- ダッシュボード -->
    <section id="tab-dash" class="tab active">
      <div class="dash-bar">
        <select id="period" aria-label="期"></select>
        <button id="dashRefresh" class="btn">🔄 更新</button>
        <button id="addOpen" class="btn ghost">＋ 明細を追加</button>
      </div>
      <small id="dashStatus" class="muted"></small>

      <!-- 明細を追加（ふだんは閉じている） -->
      <div class="card" id="addPanel" hidden>
        <h3>明細を追加</h3>
        <select id="accountSelect"><option value="">ログインしてください</option></select>
        <div class="row status-row"><small class="list-status muted"></small><button type="button" class="btn small ghost refresh-btn">🔄 口座一覧を最新にする</button></div>
        <div id="accountLink"></div>
        <label class="drop" id="dropZone">
          <input type="file" id="fileInput" multiple accept=".csv,.pdf,.txt,.xlsx,.xls,image/*" />
          <span>明細ファイルを選ぶ</span>
        </label>
        <div id="pending"></div>
      </div>

      <div id="dash"></div>
    </section>

    <!-- 設定 -->
    <section id="tab-settings" class="tab">
      <div class="card">
        <h2>口座・カード・売上振込</h2>
        <p class="muted">Googleドライブのフォルダから読み込んだ一覧です。「URL」で明細ページのリンクを変えられます。</p>
        <div class="row status-row"><small class="list-status muted"></small><button type="button" class="btn small ghost refresh-btn">🔄 最新にする</button></div>
        <div id="accountList" class="muted">ログインすると表示されます</div>
        <label class="row muted"><input type="checkbox" id="showClosed" /> 解約済みも表示</label>
        <form id="addForm">
          <h3>追加する</h3>
          <select id="newKind"></select>
          <input id="newName" type="text" placeholder="名前（例：三井住友銀行）" required maxlength="60" />
          <input id="newUrl" type="text" inputmode="url" placeholder="明細ページのURL（なくてもOK）" />
          <button class="btn" type="submit">追加</button>
        </form>
      </div>
      <div class="card">
        <h2>Googleドライブ</h2>
        <div id="driveLinks" class="links-list"></div>
      </div>
      <details class="card" id="googleCard">
        <summary>Googleの設定</summary>
        <input id="clientIdInput" type="text" placeholder="クライアントID" autocomplete="off" />
        <button id="saveClientId" class="btn">保存</button>
      </details>
      <div class="card">
        <h2>スマホに入れる</h2>
        <p class="muted">iPhone：Safariの共有ボタン →「ホーム画面に追加」</p>
        <button id="installBtn" class="btn" hidden>インストール</button>
      </div>
      <p id="appVersion" class="muted center"></p>
      <p class="muted center"><a href="privacy.html">プライバシーポリシー</a></p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="dash" class="active"><span>📊</span>ダッシュボード</button>
    <button data-tab="settings"><span>⚙️</span>設定</button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>
</body>
</html>
